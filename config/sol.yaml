#                                    S O L
#                                   Configuration
#
# OTLP drop-in: receives logs, metrics, and traces on standard OTLP ports
# and prints them to the console in JSON format.
#
# See https://opentelemetry.io/docs/specs/otlp/ for protocol details.
# ------------------------------------------------------------------------------

# Change this to use a non-default directory for Sol data storage:
# data_dir: "/var/lib/sol"

sources:
  otlp:
    type: opentelemetry
    grpc:
      address: "0.0.0.0:4317"
    http:
      address: "0.0.0.0:4318"

sinks:
  console_logs:
    type: console
    inputs: ["otlp.logs"]
    encoding:
      codec: json

  console_metrics:
    type: console
    inputs: ["otlp.metrics"]
    encoding:
      codec: json

  console_traces:
    type: console
    inputs: ["otlp.traces"]
    encoding:
      codec: json

# Sol's GraphQL API (disabled by default)
# Uncomment to try it out with the `sol top` command or
# in your browser at http://localhost:8686
# api:
#   enabled: true
#   address: "127.0.0.1:8686"
