sources:
  otlp:
    type: opentelemetry
    grpc:
      address: "0.0.0.0:4317"
    http:
      address: "0.0.0.0:4318"

  self_metrics:
    type: internal_metrics

transforms:
  tail_sampling_latency_error:
    type: tail_sampling
    inputs: ["otlp.traces"]
    decision_wait_secs: 10
    num_traces: 50000
    policies:
      - type: latency
        name: latency-policy
        threshold_ms: 100
      - type: and
        name: error-policy
        sub_policies:
          - type: status_code
            name: status-code-error-policy
            status_codes: ["ERROR"]
          - type: string_attribute
            name: http-status-code-error-policy
            key: error.type
            values: [4..]
            enabled_regex_matching: true
            invert_match: true

  tail_sampling_probabilistic:
    type: tail_sampling
    inputs: ["tail_sampling_latency_error"]
    decision_wait_secs: 10
    num_traces: 50000
    policies:
      - type: probabilistic
        name: probabilistic-policy
        sampling_percentage: 10.0

sinks:
  blackhole:
    type: blackhole
    inputs: ["tail_sampling_probabilistic"]

  prometheus:
    type: prometheus_exporter
    inputs: ["self_metrics"]
    address: "0.0.0.0:9598"
