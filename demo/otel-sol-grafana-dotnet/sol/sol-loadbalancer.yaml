sources:
  otlp:
    type: opentelemetry
    grpc:
      address: "0.0.0.0:4317"
    http:
      address: "0.0.0.0:4318"

  self_metrics:
    type: internal_metrics
    scrape_interval_secs: 15
    resource_attributes:
      service.name: sol/loadbalancer
      service.namespace: loadbalancer
  host_metrics:
    type: host_metrics
    scrape_interval_secs: 15
    namespace: ""
    resource_attributes:
      service.name: sol-loadbalancer

transforms:
  promote_host_metrics_attrs:
    type: remap
    inputs: ["host_metrics"]
    source: |
      .name = "node_" + string!(.name)

sinks:
  otlp_traces:
    type: opentelemetry
    inputs: ["otlp.traces"]
    acknowledgements:
      enabled: true
    protocol:
      type: grpc
      load_balancing:
        routing_key: traceID
        resolver:
          type: dns
          hostname: sol-collector
      batch:
        max_events: 1000
        timeout_secs: 1

  otlp_self_metrics:
    type: opentelemetry
    inputs: ["self_metrics", "promote_host_metrics_attrs"]
    protocol:
      type: grpc
      endpoint: "http://sol-gateway:4317"
      batch:
        max_events: 1000
        timeout_secs: 15
