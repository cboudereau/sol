sources:
  otlp:
    type: opentelemetry
    grpc:
      address: "0.0.0.0:4317"
    http:
      address: "0.0.0.0:4318"

  self_metrics:
    type: internal_metrics
    scrape_interval_secs: 15
    resource_attributes:
      service.name: sol/gateway
      service.namespace: gateway

  host_metrics:
    type: host_metrics
    scrape_interval_secs: 15
    namespace: ""
    resource_attributes:
      service.name: sol

transforms:
  # Promote resource attributes to metric data point attributes.
  # Equivalent to otelcontribcol transform/metrics/dotnet processor.
  promote_resource_attrs:
    type: remap
    inputs: ["otlp.metrics"]
    source: |
      .attributes."service.name" = .resource.attributes."service.name"
      .attributes."service.namespace" = .resource.attributes."service.namespace"
      .attributes."service.version" = .resource.attributes."service.version"
      .attributes."deployment.environment" = .resource.attributes."deployment.environment"
      .attributes."host.name" = .resource.attributes."host.name"

  promote_self_metrics_attrs:
    type: remap
    inputs: ["self_metrics"]
    source: |
      .attributes."service.name" = .resource.attributes."service.name"
      .attributes."service.namespace" = .resource.attributes."service.namespace"

  promote_host_metrics_attrs:
    type: remap
    inputs: ["host_metrics"]
    source: |
      .name = "node_" + string!(.name)

sinks:
  otlp_traces:
    type: opentelemetry
    inputs: ["otlp.traces"]
    acknowledgements:
      enabled: true
    protocol:
      type: grpc
      endpoint: "http://sol-loadbalancer:4317"
      batch:
        max_events: 1000
        timeout_secs: 1

  otlp_logs:
    type: opentelemetry
    inputs: ["otlp.logs"]
    acknowledgements:
      enabled: true
    protocol:
      type: http
      endpoint: "http://loki:3100/otlp"
      batch:
        max_events: 1000
        timeout_secs: 1

  otlp_metrics:
    type: opentelemetry
    inputs: ["promote_resource_attrs"]
    acknowledgements:
      enabled: true
    protocol:
      type: http
      endpoint: "http://mimir:9009/otlp"
      batch:
        max_events: 1000
        timeout_secs: 1

  otlp_self_metrics:
    type: opentelemetry
    inputs: ["promote_self_metrics_attrs", "promote_host_metrics_attrs"]
    protocol:
      type: http
      endpoint: "http://mimir:9009/otlp"
      batch:
        max_events: 1000
        timeout_secs: 15

  parquet_logs:
    type: file
    inputs: ["otlp.logs"]
    path: "/data/parquet/logs/%Y-%m-%d-%H-%M-%S.parquet"
    encoding:
      codec: text
    batch_encoding:
      codec: parquet
      compression: zstd
    batch:
      max_events: 5000
      timeout_secs: 30

  parquet_traces:
    type: file
    inputs: ["otlp.traces"]
    path: "/data/parquet/traces/%Y-%m-%d-%H-%M-%S.parquet"
    encoding:
      codec: text
    batch_encoding:
      codec: parquet
      compression: zstd
    batch:
      max_events: 5000
      timeout_secs: 30

  parquet_metrics:
    type: file
    inputs: ["promote_resource_attrs"]
    path: "/data/parquet/metrics/%Y-%m-%d-%H-%M-%S.parquet"
    encoding:
      codec: text
    batch_encoding:
      codec: parquet
      compression: zstd
    batch:
      max_events: 5000
      timeout_secs: 30
