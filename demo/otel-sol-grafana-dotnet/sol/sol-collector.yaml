sources:
  otlp:
    type: opentelemetry
    grpc:
      address: "0.0.0.0:4317"
    http:
      address: "0.0.0.0:4318"

  self_metrics:
    type: internal_metrics
    scrape_interval_secs: 15
    resource_attributes:
      service.name: sol/collector
      service.namespace: collector

  host_metrics:
    type: host_metrics
    scrape_interval_secs: 15
    namespace: ""
    resource_attributes:
      service.name: sol-collector

transforms:
  tail_sampling:
    type: tail_sampling
    inputs: ["otlp.traces"]
    decision_wait_secs: 10
    num_traces: 50000
    policies:
      - type: and
        name: sampled-latency-policy
        sub_policies:
          - type: latency
            name: latency-policy
            threshold_ms: 100
          - type: probabilistic
            name: probabilistic-policy
            sampling_percentage: 10.0
      - type: latency
        name: high-latency-policy
        threshold_ms: 500
      - type: and
        name: sampled-error-policy
        sub_policies:
          - type: status_code
            name: status-code-error-policy
            status_codes: ["ERROR"]
          - type: string_attribute
            name: http-status-code-error-policy
            key: http.response.status_code
            values: [4..]
            enabled_regex_matching: true
            invert_match: true
  promote_host_metrics_attrs:
    type: remap
    inputs: ["host_metrics"]
    source: |
      .attributes.job = .resource.attributes."service.name"
      .name = "node_" + string!(.name)

  span_metrics:
    type: span_metrics
    inputs: ["otlp.traces"]
    namespace: "traces.span.metrics"
    metrics_flush_interval_secs: 15
    dimensions:
      - name: db.system
      - name: messaging.system

  servicegraph:
    type: servicegraph
    inputs: ["otlp.traces"]
    metrics_flush_interval_secs: 15
    dimensions: ["db.system", "messaging.system"]
    store:
      ttl_secs: 2
      max_items: 1000

sinks:
  otlp_tempo:
    type: opentelemetry
    inputs: ["tail_sampling"]
    acknowledgements:
      enabled: true
    protocol:
      type: grpc
      endpoint: "http://tempo:4317"
      batch:
        max_events: 1000
        timeout_secs: 1

  otlp_span_metrics:
    type: opentelemetry
    inputs: ["span_metrics", "servicegraph"]
    acknowledgements:
      enabled: true
    protocol:
      type: http
      endpoint: "http://mimir:9009/otlp"
      batch:
        max_events: 1000
        timeout_secs: 1

  otlp_self_metrics:
    type: opentelemetry
    inputs: ["self_metrics", "promote_host_metrics_attrs"]
    protocol:
      type: grpc
      endpoint: "http://sol-gateway:4317"
      batch:
        max_events: 1000
        timeout_secs: 15
