services:
  # ── OTel Collector Contrib (reference) ────────────────────────
  otelcontribcol:
    image: otel/opentelemetry-collector-contrib:0.122.0
    command: "--config /etc/otelcol-contrib/config.yml"
    volumes:
      - ./otelcontribcol/:/etc/otelcol-contrib/:ro
    networks:
      - bridge
    ports:
      - "4318:4318"
      - "4317:4317"
    # healthcheck:
    #   test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133/"]
    #   interval: 2s
    #   timeout: 2s
    #   retries: 10

  # ── Sol (drop-in replacement) ─────────────────────────────────
  sol:
    # build:
    #   context: ../..
    #   dockerfile: demo/Dockerfile.sol
    image: superbeeeeeee/sol:latest
    command: ["--config", "/etc/sol/sol.yaml"]
    volumes:
      - ./sol/:/etc/sol/:ro
    networks:
      - bridge
    ports:
      - "4328:4318"
      - "4327:4317"
    # healthcheck:
    #   test: ["CMD-SHELL", "echo > /dev/tcp/localhost/4318 || exit 1"]
    #   interval: 2s
    #   timeout: 2s
    #   retries: 10

  # ── Curl tests → OTel Collector (OTLP/JSON) ──────────────────
  otel-logs:
    image: curlimages/curl:8.12.0
    command: >-
      -sS --retry 5 --retry-delay 2 --retry-connrefused
      -X POST -H 'Content-Type: application/json'
      -d @/otlpjson/logs.json
      -w "\n%{http_code}\n"
      otelcontribcol:4318/v1/logs
    volumes:
      - ./otlpjson/logs.json:/otlpjson/logs.json:ro
    depends_on:
      otelcontribcol:
        condition: service_started
    networks:
      - bridge

  otel-metrics:
    image: curlimages/curl:8.12.0
    command: >-
      -sS --retry 5 --retry-delay 2 --retry-connrefused
      -X POST -H 'Content-Type: application/json'
      -d @/otlpjson/metrics.json
      -w "\n%{http_code}\n"
      otelcontribcol:4318/v1/metrics
    volumes:
      - ./otlpjson/metrics.json:/otlpjson/metrics.json:ro
    depends_on:
      otelcontribcol:
        condition: service_started
    networks:
      - bridge

  otel-traces:
    image: curlimages/curl:8.12.0
    command: >-
      -sS --retry 5 --retry-delay 2 --retry-connrefused
      -X POST -H 'Content-Type: application/json'
      -d @/otlpjson/trace.json
      -w "\n%{http_code}\n"
      otelcontribcol:4318/v1/traces
    volumes:
      - ./otlpjson/trace.json:/otlpjson/trace.json:ro
    depends_on:
      otelcontribcol:
        condition: service_started
    networks:
      - bridge

  # ── Curl tests → Sol (OTLP/JSON, direct) ──────────────────
  sol-logs:
    image: curlimages/curl:8.12.0
    command: >-
      -sS --retry 5 --retry-delay 2 --retry-connrefused
      -X POST -H 'Content-Type: application/json'
      -d @/otlpjson/logs.json
      -w "\n%{http_code}\n"
      sol:4318/v1/logs
    volumes:
      - ./otlpjson/logs.json:/otlpjson/logs.json:ro
    depends_on:
      sol:
        condition: service_started
    networks:
      - bridge

  sol-metrics:
    image: curlimages/curl:8.12.0
    command: >-
      -sS --retry 5 --retry-delay 2 --retry-connrefused
      -X POST -H 'Content-Type: application/json'
      -d @/otlpjson/metrics.json
      -w "\n%{http_code}\n"
      sol:4318/v1/metrics
    volumes:
      - ./otlpjson/metrics.json:/otlpjson/metrics.json:ro
    depends_on:
      sol:
        condition: service_started
    networks:
      - bridge

  sol-traces:
    image: curlimages/curl:8.12.0
    command: >-
      -sS --retry 5 --retry-delay 2 --retry-connrefused
      -X POST -H 'Content-Type: application/json'
      -d @/otlpjson/trace.json
      -w "\n%{http_code}\n"
      sol:4318/v1/traces
    volumes:
      - ./otlpjson/trace.json:/otlpjson/trace.json:ro
    depends_on:
      sol:
        condition: service_started
    networks:
      - bridge

networks:
  bridge:
