name: Checks

on:
  workflow_call:
    inputs:
      component-validation:
        description: "Run component spec validation after tests"
        type: boolean
        default: false

env:
  VERBOSE: true
  CI: true

jobs:
  check-fmt:
    name: Check format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
        with:
          rust: true
      - run: make check-fmt

  check-clippy:
    name: Check clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
        with:
          rust: true
          protoc: true
          libsasl2: true
      - run: make check-clippy

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
        with:
          rust: true
          cargo-nextest: true
          protoc: true
          libsasl2: true
      - name: Unit tests
        run: make test
        env:
          CARGO_BUILD_JOBS: 5
      - name: Component spec validation
        if: ${{ inputs.component-validation }}
        run: make test-component-validation
