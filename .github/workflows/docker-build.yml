name: Docker Build

on:
  workflow_call:
    inputs:
      sol-version:
        description: "Sol version string (e.g. 0.46.0-custom+abc1234)"
        required: true
        type: string
      sol-build-desc:
        description: "Sol build description for display"
        required: true
        type: string

env:
  VERBOSE: true
  CI: true
  DISABLE_MOLD: true
  DEBIAN_FRONTEND: noninteractive
  CARGO_PROFILE_RELEASE_LTO: fat
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
  DOCKER_REGISTRY: docker.io
  DOCKER_IMAGE: superbeeeeeee/sol

jobs:
  build-deb:
    name: Build x86_64 DEB package
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOL_VERSION: ${{ inputs.sol-version }}
      SOL_BUILD_DESC: ${{ inputs.sol-build-desc }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Bootstrap runner environment
        run: |
          sudo -E bash scripts/environment/bootstrap-ubuntu-24.04.sh
          bash scripts/environment/prepare.sh --modules=rustup
      - name: Build binary and archive
        run: TARGET=x86_64-unknown-linux-gnu make package
      - name: Build DEB package
        run: TARGET=x86_64-unknown-linux-gnu cargo vdev package deb
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sol-${{ inputs.sol-version }}-x86_64-unknown-linux-gnu
          path: target/artifacts/sol*

  build-static:
    name: Build x86_64 static musl binary
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOL_VERSION: ${{ inputs.sol-version }}
      SOL_BUILD_DESC: ${{ inputs.sol-build-desc }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Bootstrap runner environment
        run: |
          sudo -E bash scripts/environment/bootstrap-ubuntu-24.04.sh
          bash scripts/environment/prepare.sh --modules=rustup
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
      - name: Build static binary
        run: cargo build --release --no-default-features --features default --target x86_64-unknown-linux-musl
      - name: Package archive
        run: NATIVE_BUILD=false TARGET=x86_64-unknown-linux-musl cargo vdev package archive
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sol-${{ inputs.sol-version }}-x86_64-unknown-linux-musl
          path: target/artifacts/sol*

  build-docker:
    name: Build & push Docker images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build-deb, build-static]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download DEB artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sol-${{ inputs.sol-version }}-x86_64-unknown-linux-gnu
          path: distribution/docker/debian/

      - name: Download static artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sol-${{ inputs.sol-version }}-x86_64-unknown-linux-musl
          path: distribution/docker/distroless-static/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute Docker tags
        id: tags
        run: |
          IMAGE="${{ env.DOCKER_IMAGE }}"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            SHA="${{ github.event.pull_request.head.sha }}"
            SHORT_SHA="${SHA:0:7}"
            PR="${{ github.event.pull_request.number }}"
            DEBIAN_TAGS="${IMAGE}:pr-${PR},${IMAGE}:${SHORT_SHA}"
            DISTROLESS_TAGS="${IMAGE}:pr-${PR}-distroless,${IMAGE}:${SHORT_SHA}-distroless"
          else
            SHA="${{ github.sha }}"
            SHORT_SHA="${SHA:0:7}"
            DEBIAN_TAGS="${IMAGE}:${SHORT_SHA}"
            DISTROLESS_TAGS="${IMAGE}:${SHORT_SHA}-distroless"

            if [[ "${{ github.ref_type }}" == "tag" ]]; then
              VERSION="${{ github.ref_name }}"
              DEBIAN_TAGS="${DEBIAN_TAGS},${IMAGE}:${VERSION}"
              DISTROLESS_TAGS="${DISTROLESS_TAGS},${IMAGE}:${VERSION}-distroless"
            fi

            if [[ "${{ github.ref_name }}" == "main" ]]; then
              DEBIAN_TAGS="${DEBIAN_TAGS},${IMAGE}:latest"
              DISTROLESS_TAGS="${DISTROLESS_TAGS},${IMAGE}:latest-distroless"
            fi
          fi

          echo "debian=${DEBIAN_TAGS}" >> "$GITHUB_OUTPUT"
          echo "distroless=${DISTROLESS_TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push Debian image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: distribution/docker/debian
          push: true
          tags: ${{ steps.tags.outputs.debian }}
          platforms: linux/amd64

      - name: Build and push Distroless image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: distribution/docker/distroless-static
          push: true
          tags: ${{ steps.tags.outputs.distroless }}
          platforms: linux/amd64
