name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'demo/**'
      - '**.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VERBOSE: true
  CI: true
  DISABLE_MOLD: true
  DEBIAN_FRONTEND: noninteractive
  CARGO_PROFILE_RELEASE_LTO: fat
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
  DOCKER_REGISTRY: docker.io
  DOCKER_IMAGE: superbeeeeeee/sol

permissions:
  contents: read
  packages: write

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
    with:
      component-validation: true

  test-windows:
    name: Unit tests (Windows)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"
      - run: .\scripts\environment\bootstrap-windows-2025.ps1
      - run: make test

  check-deny:
    name: Security & license audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
        with:
          mold: false
          cargo-deny: true
      - run: make check-deny

  generate-metadata:
    name: Generate version metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sol_version: ${{ steps.meta.outputs.sol_version }}
      sol_build_desc: ${{ steps.meta.outputs.sol_build_desc }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
        with:
          rust: true
      - name: Generate publish metadata
        id: meta
        run: make ci-generate-publish-metadata

  build-deb:
    name: Build x86_64 DEB package
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs:
      - checks
      - generate-metadata
    env:
      SOL_VERSION: ${{ needs.generate-metadata.outputs.sol_version }}
      SOL_BUILD_DESC: ${{ needs.generate-metadata.outputs.sol_build_desc }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Bootstrap runner environment
        run: |
          sudo -E bash scripts/environment/bootstrap-ubuntu-24.04.sh
          bash scripts/environment/prepare.sh --modules=rustup
      - name: Build binary and archive
        run: TARGET=x86_64-unknown-linux-gnu make package
      - name: Build DEB package
        run: TARGET=x86_64-unknown-linux-gnu cargo vdev package deb
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sol-${{ env.SOL_VERSION }}-x86_64-unknown-linux-gnu
          path: target/artifacts/sol*

  build-docker:
    name: Build & push Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
      - generate-metadata
      - build-deb
    env:
      SOL_VERSION: ${{ needs.generate-metadata.outputs.sol_version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download DEB artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sol-${{ env.SOL_VERSION }}-x86_64-unknown-linux-gnu
          path: distribution/docker/debian/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute Docker tags
        id: tags
        run: |
          IMAGE="${{ env.DOCKER_IMAGE }}"
          SHA="${{ github.event.pull_request.head.sha }}"
          SHORT_SHA="${SHA:0:7}"
          TAGS="${IMAGE}:pr-${{ github.event.pull_request.number }},${IMAGE}:${SHORT_SHA}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: distribution/docker/debian
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64

  all-checks:
    name: CI
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - checks
      - test-windows
      - check-deny
      - build-docker
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          else
            echo "All jobs completed successfully"
          fi
