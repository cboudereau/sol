[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "BlueOak-1.0.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "OpenSSL",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib"
]

private = { ignore = true }

exceptions = [
    # MPL-2.0 are added case-by-case to make sure we are in compliance. To be in
    # compliance we cannot be modifying the source files.
    { allow = ["MPL-2.0"], name = "colored", version = "*" },
    { allow = ["MPL-2.0"], name = "webpki-roots", version = "*" },
    { allow = ["MPL-2.0"], name = "sol-common-macros", version = "*" },
    { allow = ["MPL-2.0"], name = "sol-config-common", version = "*" },
    { allow = ["MPL-2.0"], name = "sol-config-macros", version = "*" },
    { allow = ["MPL-2.0"], name = "vrl", version = "*" },
]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[advisories]
ignore = [
  # Vulnerability in `rsa` crate: https://rustsec.org/advisories/RUSTSEC-2023-0071.html
  # There is not fix available yet.
  # https://github.com/vectordotdev/vector/issues/19262
  "RUSTSEC-2023-0071",
  { id = "RUSTSEC-2024-0388", reason = "derivative is unmaintained" },
  { id = "RUSTSEC-2024-0384", reason = "instant is unmaintained" },
  { id = "RUSTSEC-2020-0168", reason = "mach is unmaintained" },
  { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained" },
  { id = "RUSTSEC-2025-0012", reason = "backoff is unmaintained" },
  # rustls-pemfile is unmaintained. Blocked by both async-nats and http 1.0.0 upgrade.
  { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is unmaintained" },
  { id = "RUSTSEC-2026-0002", reason = "latest aws-sdk-s3 (v1.119.0) is still using lru v0.12.5" },
  { id = "RUSTSEC-2026-0041", reason = "zstd decompression info leak — awaiting upstream fix" },
  { id = "RUSTSEC-2026-0049", reason = "rustls-webpki CRL matching — awaiting upstream fix" },
  { id = "RUSTSEC-2026-0097", reason = "rand unsoundness with custom logger" },
  { id = "RUSTSEC-2026-0098", reason = "rustls-webpki URI name constraints — awaiting upstream fix" },
  { id = "RUSTSEC-2026-0099", reason = "rustls-webpki wildcard name constraints — awaiting upstream fix" },
  { id = "RUSTSEC-2026-0104", reason = "rustls-webpki CRL parsing panic — awaiting upstream fix" },
  { id = "RUSTSEC-2026-0118", reason = "hickory-proto NSEC3 unbounded loop — awaiting upstream fix" },
  { id = "RUSTSEC-2026-0119", reason = "hickory-proto O(n²) name compression — awaiting upstream fix" },
  { id = "RUSTSEC-2026-0058", reason = "tokio-io is unmaintained — transitive via futures-util" },
]
