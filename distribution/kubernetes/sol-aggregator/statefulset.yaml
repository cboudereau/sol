# This file has been generated by `helm template sol sol/sol` from sol/templates/statefulset.yaml. Please re-run `make generate-kubernetes-manifests` rather than modifying this file manually.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sol
  namespace: "default"
  labels:
    app.kubernetes.io/name: sol
    app.kubernetes.io/instance: sol
    app.kubernetes.io/component: Aggregator
    app.kubernetes.io/version: "0.53.0-distroless-libc"
  annotations: {}
spec:
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: sol
      app.kubernetes.io/instance: sol
      app.kubernetes.io/component: Aggregator
  minReadySeconds: 0
  serviceName: sol-headless
  template:
