        app.kubernetes.io/name: sol
        app.kubernetes.io/instance: sol
        app.kubernetes.io/component: Aggregator
        vector.dev/exclude: "true"
    spec:
      serviceAccountName: sol
      dnsPolicy: ClusterFirst
      containers:
        - name: sol
          image: "superbeeeeeee/sol:0.53.0-distroless-libc"
          imagePullPolicy: IfNotPresent
          args:
            - --config-dir
            - /etc/sol/
          env:
            - name: SOL_LOG
              value: "info"
          ports:
