---
# This file has been generated by `helm template sol sol/sol` from sol/templates/daemonset.yaml. Please re-run `make generate-kubernetes-manifests` rather than modifying this file manually.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sol
  namespace: "default"
  labels:
    app.kubernetes.io/name: sol
    app.kubernetes.io/instance: sol
    app.kubernetes.io/component: Agent
    app.kubernetes.io/version: "0.53.0-distroless-libc"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sol
      app.kubernetes.io/instance: sol
      app.kubernetes.io/component: Agent
  minReadySeconds: 0
  template:
    metadata:
      annotations: {}
      labels:
        app.kubernetes.io/name: sol
        app.kubernetes.io/instance: sol
        app.kubernetes.io/component: Agent
        vector.dev/exclude: "true"
    spec:
      serviceAccountName: sol
      dnsPolicy: ClusterFirst
      containers:
        - name: sol
          image: "superbeeeeeee/sol:0.53.0-distroless-libc"
          imagePullPolicy: IfNotPresent
          args:
            - --config-dir
            - /etc/sol/
          env:
            - name: SOL_LOG
              value: "info"
            - name: SOL_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SOL_SELF_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SOL_SELF_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PROCFS_ROOT
              value: "/host/proc"
            - name: SYSFS_ROOT
              value: "/host/sys"
          ports:
            - name: prom-exporter
              containerPort: 9090
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: "/sol-data-dir"
            - name: config
              mountPath: "/etc/sol/"
              readOnly: true
            - mountPath: /var/log/
              name: var-log
              readOnly: true
            - mountPath: /var/lib
              name: var-lib
              readOnly: true
            - mountPath: /host/proc
              name: procfs
              readOnly: true
            - mountPath: /host/sys
              name: sysfs
              readOnly: true
      terminationGracePeriodSeconds: 60
      volumes:
        - name: config
          projected:
            sources:
              - configMap:
                  name: sol
        - name: data
          hostPath:
            path: "/var/lib/sol"
        - hostPath:
            path: /var/log/
          name: var-log
        - hostPath:
            path: /var/lib/
          name: var-lib
        - hostPath:
            path: /proc
          name: procfs
        - hostPath:
            path: /sys
          name: sysfs
