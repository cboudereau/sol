[package]
name = "sol-tap"
version = "0.1.0"
authors = ["Vector Contributors <vector@datadoghq.com>"]
edition = "2024"
publish = false
license = "MPL-2.0"

[features]
api = ["dep:async-graphql"]

[dependencies]
async-graphql = { version = "8.0.0-rc.5", default-features = false, features = ["graphiql"], optional = true }
colored.workspace = true
futures.workspace = true
glob.workspace = true
serde_yaml.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-stream = { workspace = true, features = ["sync"] }
tokio-tungstenite.workspace = true
tracing.workspace = true
url = { version = "2.5.4", default-features = false }
uuid.workspace = true
sol-api-client = { path = "../sol-api-client" }
sol-common = { path = "../sol-common" }
sol-core = { path = "../sol-core" }
sol-buffers = { path = "../sol-buffers" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
