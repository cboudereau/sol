[package]
name = "codecs"
version = "0.1.0"
authors = ["Vector Contributors <vector@datadoghq.com>"]
edition = "2024"
publish = false

[lints.clippy]
unwrap-used = "deny"

[[bin]]
name = "generate-avro-fixtures"
path = "tests/bin/generate-avro-fixtures.rs"

[dependencies]
apache-avro = { version = "0.20.0", default-features = false }
arrow = { version = "56.2.0", default-features = false, features = ["ipc"], optional = true }
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
csv-core = { version = "0.1.13", default-features = false }
derivative.workspace = true
derive_more = { version = "2.0.1", optional = true, features = ["from", "display"] }
dyn-clone = { version = "1", default-features = false }
flate2.workspace = true
futures.workspace = true
influxdb-line-protocol = { version = "2", default-features = false }
lookup = { package = "sol-lookup", path = "../sol-lookup", default-features = false, features = ["test"] }
memchr = { version = "2", default-features = false }
metrics.workspace = true
sol-opentelemetry-proto = { path = "../opentelemetry-proto", optional = true }
ordered-float.workspace = true
prost.workspace = true
prost-reflect.workspace = true
rand.workspace = true
regex.workspace = true
serde.workspace = true
serde_with = { version = "3.19.0", default-features = false, features = ["std", "macros", "chrono_0_4"] }
serde_json.workspace = true
serde_arrow = { version = "0.14", features = ["arrow-56"], optional = true }
serde-aux = { version = "4.5", optional = true }
smallvec = { version = "1", default-features = false, features = ["union"] }
snafu.workspace = true
strum = { version = "0.26.3", features = ["derive"], optional = true }
syslog_loose = { version = "0.23", default-features = false, optional = true }
tokio-util = { version = "0.7", default-features = false, features = ["codec"] }
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
vrl.workspace = true
sol-common = { path = "../sol-common", default-features = false }
sol-common-macros.workspace = true
sol-config = { path = "../sol-config", default-features = false }
sol-config-macros = { path = "../sol-config-macros", default-features = false }
sol-core = { path = "../sol-core", default-features = false, features = ["vrl"] }
sol-vrl-functions.workspace = true
toml = { version = "0.9.8", optional = true }

[dev-dependencies]
futures.workspace = true
indoc.workspace = true
toml.workspace = true
opentelemetry-proto = { version = "0.27", default-features = false, features = ["full", "with-serde"] }
tokio = { workspace = true, features = ["test-util"] }
similar-asserts = "1.7.0"
sol-core = { path = "../sol-core", default-features = false, features = ["vrl", "test"] }
rstest = "0.26.1"
tracing-test = "0.2.6"
uuid.workspace = true
vrl.workspace = true

[features]
arrow = ["dep:arrow", "dep:serde_arrow"]
opentelemetry = ["dep:sol-opentelemetry-proto"]
syslog = ["dep:syslog_loose", "dep:strum", "dep:derive_more", "dep:serde-aux", "dep:toml"]
test = []
